name: ${COMPOSE_PROJECT_NAME:-company-bank}

x-app: &app
  image: company-bank-app:local
  build: .
  user: "10001:10001"
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 0.50
  mem_limit: 160m
  memswap_limit: 160m
  pids_limit: 64
  tmpfs: ["/tmp:size=16m,mode=1777"]
  logging: {driver: local, options: {max-size: "5m", max-file: "2"}}
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 20s

services:
  bootstrap:
    <<: *app
    restart: "no"
    command: [python, scripts/bootstrap.py]
    network_mode: none
    volumes: [secrets:/secrets]
    healthcheck: {disable: true}

  db:
    image: postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    restart: unless-stopped
    environment: {POSTGRES_USER: bank, POSTGRES_DB: bank, POSTGRES_PASSWORD_FILE: /secrets/db-password, POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=40, -c, log_connections=on, -c, log_disconnections=on]
    volumes: [db-data:/var/lib/postgresql/data, secrets:/secrets:ro]
    networks: [core-db]
    depends_on: {bootstrap: {condition: service_completed_successfully}}
    cpus: 1.0
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 80
    security_opt: [no-new-privileges:true]
    logging: {driver: local, options: {max-size: "5m", max-file: "2"}}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 3s
      retries: 20

  security:
    <<: *app
    command: [python, -m, uvicorn, services.security.app:app, --host, 0.0.0.0, --port, "8080"]
    volumes: [secrets:/secrets:ro, security-data:/data]
    networks: [edge-web, dmz-api, customer-backend, staff-net, staff-auth, staff-core]
    depends_on: {bootstrap: {condition: service_completed_successfully}}

  auth:
    <<: *app
    environment: {SERVICE_ROLE: auth, AUDIT_URL: "http://security:8080"}
    volumes: [secrets:/secrets:ro, auth-data:/data]
    networks: [customer-backend, staff-auth]
    depends_on: {security: {condition: service_healthy}}

  core:
    <<: *app
    environment: {SERVICE_ROLE: core, DATABASE_HOST: db, POSTGRES_USER: bank, POSTGRES_DB: bank, AUTH_URL: "http://auth:8080", AUDIT_URL: "http://security:8080"}
    volumes: [secrets:/secrets:ro]
    networks: [customer-backend, staff-core, core-db]
    depends_on: {db: {condition: service_healthy}, auth: {condition: service_healthy}}

  customer:
    <<: *app
    environment: {SERVICE_ROLE: customer, AUTH_URL: "http://auth:8080", CORE_URL: "http://core:8080", AUDIT_URL: "http://security:8080"}
    volumes: [secrets:/secrets:ro]
    networks: [dmz-api, customer-backend]
    depends_on: {core: {condition: service_healthy}}

  employee:
    <<: *app
    environment: {SERVICE_ROLE: employee, AUTH_URL: "http://auth:8080", CORE_URL: "http://core:8080", AUDIT_URL: "http://security:8080"}
    volumes: [secrets:/secrets:ro, employee-data:/data]
    networks: [staff-net, staff-auth, staff-core]
    depends_on: {core: {condition: service_healthy}}

  office:
    <<: *app
    environment: {SERVICE_ROLE: office, AUTH_URL: "http://auth:8080", AUDIT_URL: "http://security:8080"}
    volumes: [secrets:/secrets:ro, office-data:/data]
    networks: [staff-net, staff-auth]
    depends_on: {auth: {condition: service_healthy}}

  web:
    <<: *app
    command: [python, -m, uvicorn, services.gateway.app:app, --host, 0.0.0.0, --port, "8080"]
    environment: {CUSTOMER_URL: "http://customer:8080"}
    networks: [edge-web, dmz-api]
    depends_on: {customer: {condition: service_healthy}}

  firewall:
    <<: *app
    command: [python, -m, uvicorn, services.firewall.app:app, --host, 0.0.0.0, --port, "8080"]
    environment: {WEB_URL: "http://web:8080", AUDIT_URL: "http://security:8080"}
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    volumes: [secrets:/secrets:ro, ./config/edge-routes.json:/config/edge-routes.json:ro]
    networks: [web-entry, edge-web]
    depends_on: {web: {condition: service_healthy}, security: {condition: service_healthy}}

  employee-client:
    <<: *app
    profiles: [tools]
    command: [python, -c, "import time; time.sleep(2147483647)"]
    volumes: [secrets:/secrets:ro]
    networks: [staff-net]
    healthcheck: {disable: true}

networks:
  web-entry:
    driver: bridge
    driver_opts: {com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"}
    ipam: {config: [{subnet: "10.${NETWORK_OCTET:-240}.1.0/28"}]}
  edge-web: {internal: true, ipam: {config: [{subnet: "10.${NETWORK_OCTET:-240}.2.0/28"}]}}
  dmz-api: {internal: true, ipam: {config: [{subnet: "10.${NETWORK_OCTET:-240}.3.0/28"}]}}
  customer-backend: {internal: true, ipam: {config: [{subnet: "10.${NETWORK_OCTET:-240}.4.0/28"}]}}
  staff-net: {internal: true, ipam: {config: [{subnet: "10.${NETWORK_OCTET:-240}.5.0/28"}]}}
  staff-auth: {internal: true, ipam: {config: [{subnet: "10.${NETWORK_OCTET:-240}.6.0/28"}]}}
  staff-core: {internal: true, ipam: {config: [{subnet: "10.${NETWORK_OCTET:-240}.7.0/28"}]}}
  core-db: {internal: true, ipam: {config: [{subnet: "10.${NETWORK_OCTET:-240}.8.0/28"}]}}

volumes:
  secrets:
  db-data:
  auth-data:
  employee-data:
  office-data:
  security-data:
