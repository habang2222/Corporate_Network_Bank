name: company network
on:
  push:
    paths: ["bank-lab/**", ".github/workflows/bank-lab.yml"]
  pull_request:
    paths: ["bank-lab/**", ".github/workflows/bank-lab.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bank-lab
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: python3 -m compileall -q services scripts
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: docker compose exec -T firewall python scripts/smoke.py customer
      - run: docker compose --profile tools up -d employee-client
      - run: docker compose exec -T employee-client python scripts/smoke.py staff
      - run: docker compose exec -T security python scripts/smoke.py audit
      - run: docker compose exec -T auth python -m unittest services.bank.test_boundaries -v
      - if: always()
        run: docker compose down
